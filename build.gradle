plugins {
    id 'java'
    id 'maven-publish'
    id 'idea'
    // ACHTUNG: genaue 2.x-Version vor dem ersten Build pruefen (siehe README); 2.0.x ist fuer NeoForge 21.1.x ausgelegt.
    id 'net.neoforged.moddev' version '2.0.78'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    mavenLocal()
    maven {
        url = 'https://maven.createmod.net'
        content {
            includeGroupAndSubgroups('net.createmod')
            includeGroupAndSubgroups('dev.engine-room')
            includeGroupAndSubgroups('com.simibubi')
        }
    } // Create, Ponder, Flywheel
    maven { url = 'https://maven.tterrag.com/' } // Registrate
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.parchmentmc.org' }
    maven { url = 'https://modmaven.dev/' } // Flywheel (Alternative)
    maven { url = 'https://mvn.devos.one/releases' }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup('maven.modrinth') }
    }
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup('curse.maven') }
    }
    maven { url = 'https://maven.architectury.dev/' } // Architectury API
}

neoForge {
    version = neo_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

dependencies {
    // Create (slim, ohne transitive Abhaengigkeiten)
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")
    implementation("dev.architectury:architectury-neoforge:${architectury_version}")

    // Create: Power Grid - Jar vom Nutzer in libs/ ablegen (siehe libs/README.md)
    compileOnly files('libs/powergrid-mc1.21.1-0.6.2.jar')
    localRuntime files('libs/powergrid-mc1.21.1-0.6.2.jar')
    // Alternative ueber CurseMaven (Datei-ID der Power-Grid-Version 0.6.2 auf CurseForge eintragen):
    // compileOnly "curse.maven:power-grid-1321420:<fileId>"
    // localRuntime "curse.maven:power-grid-1321420:<fileId>"

    // ejml 0.44.0 wird zur Laufzeit von Power Grid benoetigt. Falls das Power-Grid-Jar es nicht
    // selbst mitbringt (Jar-in-Jar), hier einkommentieren (siehe README):
    // localRuntime "org.ejml:ejml-core:${ejml_version}"
    // localRuntime "org.ejml:ejml-simple:${ejml_version}"
    // localRuntime "org.ejml:ejml-ddense:${ejml_version}"
    // localRuntime "org.ejml:ejml-dsparse:${ejml_version}"
}

// ${version} in neoforge.mods.toml ersetzen (alle anderen Werte stehen dort literal)
tasks.named('processResources', ProcessResources) {
    var replaceProperties = [version: mod_version]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('jar') {
    from('LICENSE') { rename { "${it}_${mod_id}" } }
    from('NOTICE') { rename { "${it}_${mod_id}" } }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven { url = "file://${project.projectDir}/repo" }
    }
}

