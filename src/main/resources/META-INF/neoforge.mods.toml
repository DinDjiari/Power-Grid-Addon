[[mods]]
modId = "pghv"
version = "${version}"
displayName = "Power Grid: High Voltage"
authors = "Tomrox GmbH"
description = '''
Hochspannungs-Addon fuer Create: Power Grid.
Fuegt ein Messing-Voltmeter mit Messbereichen bis 2 MV, einen Trafo-Kuehllueffter
(flache 2x2-Platte, 240 V, Drehzahlmenue) und Mehrleiter-Erdkabel mit Kabelboxen hinzu.
'''

